name: Bodega CI

# M3 8.5: runs on every pull request to main and every push. Tests and image builds run everywhere;
# the deploy job runs only for pushes to main, and only after every other job has passed.
on:
  push:
    branches:
      - main
      - "feature/**"
      - "jose/**"
      - "gabriel/**"
      - "diushen/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run (never a deploy in progress on main).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run backend tests
        run: docker compose -f compose.test.yml run --build --rm backend-tests

  frontend-checks:
    name: Frontend Tests, Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run frontend checks
        run: docker compose -f compose.test.yml run --build --rm frontend-checks

  static-checks:
    name: Lint and Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history for the secret scan)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # M3 8.5 "ruff check". Rules live in backend/ruff.toml.
      - name: Ruff
        run: pipx run ruff==0.17.4 check backend

      # M1/M2/M3: the Mermaid sources in docs/ are living artifacts; every one must render.
      - name: Mermaid diagrams render
        run: |
          for f in docs/architecture/*.mmd docs/requirements/*.mmd; do
            npx -y @mermaid-js/mermaid-cli@11.4.2 -p docs/.mermaid-puppeteer.json -q -i "$f" -o "/tmp/$(basename "$f").svg"
          done

      # NFR-718 regression guard: trusting every proxy header lets clients bypass the rate limit.
      - name: Backend does not trust spoofable proxy headers
        run: |
          grep '^CMD' backend/Dockerfile | grep -q -- '--no-proxy-headers'
          ! grep '^CMD' backend/Dockerfile | grep -q -e 'forwarded-allow-ips' -e ' --proxy-headers'

      # NFR-712: an automated secret scan of the code and its history must report 0 findings.
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.21.2 git /repo --redact --no-banner

  production-images:
    name: Production Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Proves the Dockerfiles Render builds still work (Render builds its own copy).
      - name: Build backend image
        run: docker build -t bodega-backend:ci ./backend

      - name: Build frontend image (nginx)
        run: docker build -t bodega-frontend:ci ./frontend

      - name: Smoke-test the frontend image
        run: |
          docker run -d --name web -e PORT=8080 -e API_BASE_URL=api.example.com -p 8080:8080 bodega-frontend:ci
          for attempt in $(seq 1 20); do curl -fsS http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8080/capture | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/config.js | grep -q "apiBaseUrl: 'https://api.example.com'"
          curl -fsSI http://localhost:8080/capture | grep -qi "strict-transport-security"
          docker rm -f web

      # NFR-712: the code delivered to the browser holds no credentials (SRS 7.3: scan the bundle too).
      - name: Secret-scan the browser bundle
        run: |
          docker create --name bundle bodega-frontend:ci >/dev/null
          docker cp bundle:/usr/share/nginx/html ./bundle
          docker rm bundle >/dev/null
          docker run --rm -v "$PWD/bundle:/bundle:ro" zricethezav/gitleaks:v8.21.2 dir /bundle --redact --no-banner
          ! grep -rqE "sk-ant-|AI_API_KEY|S3_SECRET|APP_ACCESS_CODE" bundle

  deploy:
    name: Deploy to Render
    needs: [backend-tests, frontend-checks, static-checks, production-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Trigger Render deploy hooks
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
          FRONTEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          if [ -z "$BACKEND_HOOK" ] || [ -z "$FRONTEND_HOOK" ]; then
            echo "::warning::Render deploy hooks are not configured; skipping deploy. See docs/LUIS_IMPLEMENTATION.md."
            exit 0
          fi
          curl -fsS -X POST "$BACKEND_HOOK" > /dev/null
          curl -fsS -X POST "$FRONTEND_HOOK" > /dev/null
          echo "Deploy triggered for backend and frontend."
