# Render Blueprint (M3 8.1-8.3): two Docker web services and a managed PostgreSQL 16 database.
# Auto-deploy is OFF: production only changes when the GitHub Actions deploy job calls the deploy hooks,
# which happens after every check passes on main (M3 8.5).
#
# Variables marked `sync: false` are secrets: Render asks for them when the Blueprint is first applied,
# and they are never stored in this repository.

databases:
  - name: bodega-db
    databaseName: bodega
    user: bodega
    postgresMajorVersion: "16"
    # Free databases expire after 30 days (M3 12.1). Switch to a paid plan (e.g. basic-256mb) for the demo period.
    plan: free
    ipAllowList: []  # Only Render services in this account can connect.

services:
  - type: web
    name: bodega-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    autoDeploy: false
    # Render switches traffic only after /health answers 200; migrations run before it does.
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bodega-db
          property: connectionString
      # Empty = no AI provider: extraction falls back to manual entry, guidance to "Standard advice".
      # Set to "claude" only after the account owner records the provider's data-use and retention
      # terms in docs/privacy.md section 3 (NFR-716); sending sales data before that would breach it.
      - key: AI_PROVIDER
        value: ""
      - key: AI_API_KEY
        sync: false
      - key: AI_EXTRACTION_MODEL
        value: claude-sonnet-5-5
      - key: AI_GUIDANCE_MODEL
        value: claude-haiku-5-5
      - key: S3_ENDPOINT_URL
        sync: false  # https://<account-id>.r2.cloudflarestorage.com
      - key: S3_BUCKET
        value: sales-images
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: APP_ACCESS_CODE
        sync: false  # At least 12 characters (M3 8.3).
      - key: OWNER_ID
        value: 00000000-0000-4000-8000-000000000001
      - key: OWNER_DISPLAY_NAME
        value: Bodega Owner
      - key: APP_TIMEZONE
        value: America/Santo_Domingo
      # Render's edge proxy appends the connecting client address to X-Forwarded-For; the
      # access-code rate limit counts that right-most entry (see app/security.py).
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # The only CORS origin: the frontend's public URL, e.g. https://bodega-frontend.onrender.com
      # (fromService would give the private-network host name, which browsers cannot use).
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: bodega-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    autoDeploy: false
    healthCheckPath: /
    envVars:
      # The backend's public URL, e.g. https://bodega-backend.onrender.com; written to /config.js at start.
      - key: API_BASE_URL
        sync: false
