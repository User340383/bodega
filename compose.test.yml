name: bodega-gabriel-test
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: bodega_test
      POSTGRES_USER: bodega_test
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodega_test -d bodega_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  backend-tests:
    build: ./backend
    environment:
      TEST_DATABASE_URL: postgresql://bodega_test:test-only-password@postgres-test:5432/bodega_test
      TEST_S3_ENDPOINT: http://minio-test:9000
    depends_on:
      postgres-test:
        condition: service_healthy
      minio-test:
        condition: service_started
    command: ["python", "-m", "pytest", "-q", "-ra"]
  minio-test:
    image: cgr.dev/chainguard/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: testaccess
      MINIO_ROOT_PASSWORD: test-only-storage-password
    tmpfs:
      - /data
  frontend-checks:
    build: ./frontend
    command: ["sh", "-c", "npm run lint && npm test && npm run build"]

  backend-smoke:
    profiles: [smoke]
    build: ./backend
    environment:
      DATABASE_URL: postgresql://bodega_test:test-only-password@postgres-test:5432/bodega_test
      APP_ACCESS_CODE: smoke-test-code
      OWNER_ID: 00000000-0000-4000-8000-000000000001
    depends_on:
      postgres-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 5s
      retries: 30
  frontend-smoke:
    profiles: [smoke]
    build: ./frontend
    environment:
      BODEGA_API_TARGET: http://backend-smoke:8000
      BODEGA_ALLOWED_HOSTS: frontend-smoke
    depends_on:
      backend-smoke:
        condition: service_healthy
  http-smoke:
    profiles: [smoke]
    build: ./backend
    environment:
      API_URL: http://frontend-smoke:5173
    depends_on:
      - frontend-smoke
    command: ["python", "tests/smoke_http.py"]
