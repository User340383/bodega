# Alembic (M3 8.5 "alembic upgrade head"). The database URL comes from DATABASE_URL and the schema
# from BODEGA_DB_SCHEMA; see alembic/env.py. The backend runs this at startup (app.database.migrate).
[alembic]
script_location = alembic
version_locations = alembic/versions
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
formatter = generic

[formatter_generic]
format = %%(levelname)s %%(name)s %%(message)s
